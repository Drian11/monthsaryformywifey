<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever & Always ❤️</title>
  <style>
    :root {
      --bg: #180813;
      --card-bg: rgba(35, 15, 28, 0.85);
      --accent: #ff4b72;
      --text: #fff0f3;
      --text-muted: #ffb3c1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #2d0b22 0%, #0f030b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .heart-bg {
      position: fixed;
      color: rgba(255, 75, 114, 0.25);
      animation: floatUp linear infinite;
      user-select: none;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 60px 40px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(255, 75, 114, 0.2), 0 0 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 179, 193, 0.2);
      max-width: 800px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;

      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .main-message {
      font-size: 2.3rem;
      line-height: 1.5;
      color: var(--text);
      font-family: 'Comic Sans MS', 'cursive', sans-serif;
      text-shadow: 0 0 10px rgba(255, 75, 114, 0.3);
    }

    .pill-box {
      border: 2px solid var(--accent);
      border-radius: 50px;
      padding: 22px 35px;
      background: rgba(255, 75, 114, 0.08);
      box-shadow: 0 0 20px rgba(255, 75, 114, 0.3);
      width: 100%;
      max-width: 650px;
    }

    .pill-text {
      font-size: 1.6rem;
      color: var(--accent);
      font-family: 'Comic Sans MS', 'cursive', sans-serif;
      text-shadow: 0 0 8px rgba(255, 75, 114, 0.4);
    }

    @media (max-width: 600px) {
      .main-message { font-size: 1.7rem; }
      .pill-text { font-size: 1.25rem; }
      .section-card { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <div class="section-card">
    <div class="main-message">
      More days, weeks, months<br>to come for us my wifey! 💕
    </div>

    <div class="pill-box">
      <div class="pill-text">
        I love you so much and I will always will ❤️
      </div>
    </div>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerText = ['❤️', '💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      heart.style.fontSize = Math.random() * 18 + 12 + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 450);
  </script>

</body>
</html>
