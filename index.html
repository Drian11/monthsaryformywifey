<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Monthsary ❤️</title>
  <style>
    :root {
      --bg: #180813;
      --card-bg: rgba(35, 15, 28, 0.85);
      --accent: #ff4b72;
      --accent-hover: #e03358;
      --text: #fff0f3;
      --text-muted: #ffb3c1;
      --error: #ff3355;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #2d0b22 0%, #0f030b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Floating Background Hearts */
    .heart-bg {
      position: absolute;
      color: rgba(255, 75, 114, 0.25);
      animation: floatUp linear infinite;
      user-select: none;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Main Container Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(255, 75, 114, 0.2), 0 0 20px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 179, 193, 0.2);
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease-out forwards;
    }

    #lockCard h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 75, 114, 0.4);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .pin-input {
      width: 100%;
      padding: 16px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 8px;
      border-radius: 16px;
      border: 2px solid rgba(255, 179, 193, 0.3);
      background-color: rgba(15, 3, 11, 0.6);
      color: var(--text);
      outline: none;
      transition: all 0.3s;
    }

    .pin-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255, 75, 114, 0.5);
    }

    .error-msg {
      color: var(--error);
      font-size: 0.95rem;
      margin-top: 15px;
      font-weight: 600;
      min-height: 22px;
      text-shadow: 0 0 8px rgba(255, 51, 85, 0.4);
    }

    .btn-unlock {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: linear-gradient(135deg, #ff4b72, #ff758f);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
      transition: all 0.2s;
    }

    .btn-unlock:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 75, 114, 0.6);
    }

    .handwritten-msg {
      font-size: 2.3rem;
      color: var(--accent);
      font-family: 'Comic Sans MS', 'cursive', sans-serif;
      text-shadow: 0 0 12px rgba(255, 75, 114, 0.4);
    }

    .wifey-msg {
      font-size: 1.9rem;
      margin-bottom: 25px;
      color: var(--accent);
      font-family: 'Comic Sans MS', 'cursive', sans-serif;
      text-shadow: 0 0 12px rgba(255, 75, 114, 0.4);
    }

    .question {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 35px;
    }

    .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 50px;
      position: relative;
    }

    .btn-action {
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff4b72, #d946ef);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
      white-space: nowrap;
      transition: transform 0.2s;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }

    .btn-wait {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 179, 193, 0.3);
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .hidden { display: none !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-exit {
      animation: fadeOut 0.5s ease-in forwards !important;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- LOCK CARD -->
  <div class="card" id="lockCard">
    <h2>Enter Secret PIN 🔒</h2>
    <p class="subtitle">Hint: Our special day (MMDD)</p>
    
    <input 
      type="password" 
      id="pinInput" 
      class="pin-input" 
      placeholder="••••" 
      maxlength="4"
      autofocus
    />
    
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-unlock" onclick="checkPin()">Unlock ❤️</button>
  </div>

  <!-- SURPRISE CARD -->
  <div class="card hidden" id="unlockedCard">
    <div class="handwritten-msg">Happy Monthsary</div>
    <div class="wifey-msg">my Wifey! 💕</div>
    
    <p class="question">Ready for surprise?</p>
    
    <div class="button-container">
      <button class="btn-action" onclick="navigateTo('page2.html')">of course!</button>
      <button class="btn-wait" id="waitBtn" onmouseover="dodgeButton()" onclick="dodgeButton()">uhm, wait...</button>
    </div>
  </div>

  <script>
    const CORRECT_PIN = "0711";
    
    const errorMessages = [
      "You forgot our day?:<",
      "you don't love me anymore?:<"
    ];
    let errorIndex = 0;

    function checkPin() {
      const userPin = document.getElementById("pinInput").value;
      const errorElement = document.getElementById("errorMsg");
      const lockCard = document.getElementById("lockCard");
      const unlockedCard = document.getElementById("unlockedCard");

      if (userPin === CORRECT_PIN) {
        lockCard.classList.add("hidden");
        unlockedCard.classList.remove("hidden");
      } else {
        errorElement.textContent = errorMessages[errorIndex];
        errorIndex = (errorIndex + 1) % errorMessages.length;

        document.getElementById("pinInput").value = "";
        document.getElementById("pinInput").focus();
      }
    }

    document.getElementById("pinInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkPin();
    });

    function navigateTo(url) {
      const card = document.getElementById('unlockedCard');
      card.classList.add('page-exit');
      setTimeout(() => {
        window.location.href = url;
      }, 500);
    }

    function dodgeButton() {
      const btn = document.getElementById('waitBtn');
      const randomX = (Math.random() - 0.5) * 240;
      const randomY = (Math.random() - 0.5) * 240;
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-bg');
      heart.innerText = ['❤️', '💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 3 + 's';
      heart.style.fontSize = Math.random() * 18 + 12 + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 450);
  </script>

</body>
</html>
